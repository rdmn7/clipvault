services:
  clipboard:
    build: .
    container_name: universal-clipboard
    restart: unless-stopped
    environment:
      PORT: "8080"
      APP_USERNAME: ${APP_USERNAME}
      APP_PASSWORD: ${APP_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET}
      ESCROW_KEY: ${ESCROW_KEY}
      DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
    networks:
      - clipboard

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: universal-clipboard-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://clipboard:8080
    depends_on:
      - clipboard
    networks:
      - clipboard

networks:
  clipboard:
